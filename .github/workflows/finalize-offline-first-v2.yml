name: Finalize Offline First v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply offline-first implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          # appCache latest cached identity
          p = Path('src/services/appCache.ts'); s = p.read_text()
          if 'export function getLatestCachedAppData()' not in s:
              marker = 'export function getSyncCachedAppData(userId?: string): CachedAppData | null {'
              helper = '''export function getLatestCachedAppData(): CachedAppData | null {\n  if (typeof localStorage === 'undefined') return null;\n  try {\n    let newest: CachedAppData | null = null;\n    for (let i = 0; i < localStorage.length; i++) {\n      const k = localStorage.key(i);\n      if (!k || !k.startsWith('tokencare_cache_')) continue;\n      const raw = localStorage.getItem(k);\n      if (!raw) continue;\n      const parsed = JSON.parse(raw) as CachedAppData;\n      if (!parsed?.userId) continue;\n      if (!newest || Number(parsed.lastSyncTimestamp || 0) > Number(newest.lastSyncTimestamp || 0)) newest = parsed;\n    }\n    return newest;\n  } catch { return null; }\n}\n\n'''
              if s.count(marker) != 1: raise SystemExit('appCache marker missing')
              s = s.replace(marker, helper + marker, 1); p.write_text(s)

          # App offline identity fallback
          p = Path('src/App.tsx'); s = p.read_text()
          s = s.replace('  getCachedAppData,\n  setCachedAppData,', '  getCachedAppData,\n  getLatestCachedAppData,\n  setCachedAppData,', 1)
          pattern = re.compile(r"        \} else \{\n          setCurrentUser\(null\);\n          setUserProfile\(null\);\n          setTokens\(\[\]\);\n        \}\n      \} catch \(err\) \{\n        console\.warn\('\[App\] Offline cache bootstrap note:', err\);\n      \}")
          replacement = '''        } else {\n          const cachedIdentity = getLatestCachedAppData();\n          if (cachedIdentity?.userId) {\n            setCurrentUser({ id: cachedIdentity.userId, email: cachedIdentity.userEmail || '', user_metadata: cachedIdentity.userProfile ? { full_name: cachedIdentity.userProfile.display_name, username: cachedIdentity.userProfile.username, avatar_url: cachedIdentity.userProfile.avatar_url } : {} });\n            if (cachedIdentity.userProfile) setUserProfile(cachedIdentity.userProfile);\n            if (cachedIdentity.tokens) setTokens(cachedIdentity.tokens);\n            if (cachedIdentity.wallet) setWallet(cachedIdentity.wallet);\n            setUnreadNotificationCount(cachedIdentity.unreadCount || 0);\n            setLastSyncTimestamp(cachedIdentity.lastSyncTimestamp || null);\n            setSessionStatus('offline');\n          } else {\n            setCurrentUser(null);\n            setUserProfile(null);\n            setTokens([]);\n          }\n        }\n      } catch (err) {\n        const cachedIdentity = getLatestCachedAppData();\n        if (cachedIdentity?.userId) {\n          setCurrentUser({ id: cachedIdentity.userId, email: cachedIdentity.userEmail || '', user_metadata: {} });\n          if (cachedIdentity.userProfile) setUserProfile(cachedIdentity.userProfile);\n          if (cachedIdentity.tokens) setTokens(cachedIdentity.tokens);\n          if (cachedIdentity.wallet) setWallet(cachedIdentity.wallet);\n          setUnreadNotificationCount(cachedIdentity.unreadCount || 0);\n          setLastSyncTimestamp(cachedIdentity.lastSyncTimestamp || null);\n          setSessionStatus('offline');\n        } else {\n          console.warn('[App] Offline cache bootstrap note:', err);\n        }\n      }'''
          if not pattern.search(s): raise SystemExit('App bootstrap regex did not match')
          s = pattern.sub(replacement, s, count=1); p.write_text(s)

          # Developer cache-first loader. Replace from comment to the next endpoint effect.
          p = Path('src/views/DeveloperView.tsx'); s = p.read_text()
          if "from '../services/developerCache'" not in s:
              s = s.replace("import { ToastNotification } from '../components/ToastNotification';\n", "import { ToastNotification } from '../components/ToastNotification';\nimport { getCachedDeveloperView, setCachedDeveloperView, clearCachedDeveloperView } from '../services/developerCache';\n", 1)

          start = s.find('  // Load project & stats from Supabase Developer tables and RPCs')
          end_marker = '  // Sync selected endpoint parameters'
          end = s.find(end_marker, start)
          if start < 0 or end < 0: raise SystemExit('Developer loader boundaries missing')
          loader = '''  // Cache-first Developer dashboard: render cached data immediately, then refresh in background online.\n  const loadData = async (options: { background?: boolean } = {}) => {\n    const background = options.background === true;\n    const userId = currentUser?.id;\n    if (!userId) return;\n\n    const cached = getCachedDeveloperView(userId);\n    const hadCachedProject = !!cached?.project;\n\n    if (cached) {\n      setProject(cached.project);\n      setQuota(cached.quota);\n      setPlans(Array.isArray(cached.plans) && cached.plans.length ? cached.plans : DEFAULT_DEVELOPER_PLANS);\n      setSubscriptions(Array.isArray(cached.subscriptions) ? cached.subscriptions : []);\n      setUsage(Array.isArray(cached.usage) ? cached.usage : []);\n      setLogs(Array.isArray(cached.logs) ? cached.logs : []);\n      if (cached.project) {\n        setEditProjectName(cached.project.project_name || '');\n        setShowCreateModal(false);\n      } else setShowCreateModal(true);\n      setLoading(false);\n    } else if (!background) {\n      setLoading(true);\n    }\n\n    setError('');\n    if (typeof navigator !== 'undefined' && !navigator.onLine) {\n      if (!cached) {\n        setProject(null); setQuota(null); setUsage([]); setLogs([]); setSubscriptions([]); setShowCreateModal(true);\n      }\n      setLoading(false);\n      return;\n    }\n\n    try {\n      const proj = await getDeveloperProject();\n      if (!proj) {\n        if (hadCachedProject) {\n          clearCachedDeveloperView(userId);\n          setProject(null); setQuota(null); setUsage([]); setLogs([]); setSubscriptions([]); setShowCreateModal(true);\n          showToast('Project deleted. Create a new developer project.', 'info');\n        } else {\n          setProject(null); setQuota(null); setUsage([]); setLogs([]); setSubscriptions([]); setShowCreateModal(true);\n        }\n        return;\n      }\n\n      setProject(proj); setShowCreateModal(false); setEditProjectName(proj.project_name || '');\n      const [quotaData, plansData, usageData, logData, subsData] = await Promise.all([\n        getDeveloperQuota().catch(() => null),\n        getDeveloperPlans().catch(() => DEFAULT_DEVELOPER_PLANS),\n        getDeveloperUsage(30).catch(() => []),\n        getDeveloperApiLogs(100).catch(() => []),\n        getDeveloperSubscriptions().catch(() => []),\n      ]);\n      const finalPlans = Array.isArray(plansData) && plansData.length ? plansData : DEFAULT_DEVELOPER_PLANS;\n      const finalUsage = Array.isArray(usageData) ? usageData : [];\n      const finalLogs = Array.isArray(logData) ? logData : [];\n      const finalSubs = Array.isArray(subsData) ? subsData : [];\n      setQuota(quotaData); setPlans(finalPlans); setUsage(finalUsage); setLogs(finalLogs); setSubscriptions(finalSubs);\n      setCachedDeveloperView({ userId, project: proj, quota: quotaData, plans: finalPlans, subscriptions: finalSubs, usage: finalUsage, logs: finalLogs, lastSyncTimestamp: Date.now() });\n    } catch (err: any) {\n      console.warn('[DeveloperView] refresh failed; preserving cached dashboard:', err);\n      if (!cached) setError(err?.message || 'Unable to load developer project from Supabase.');\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  useEffect(() => {\n    loadData();\n    const handleOffline = () => setLoading(false);\n    const handleOnline = () => loadData({ background: true });\n    window.addEventListener('offline', handleOffline);\n    window.addEventListener('online', handleOnline);\n    return () => {\n      window.removeEventListener('offline', handleOffline);\n      window.removeEventListener('online', handleOnline);\n    };\n  }, [currentUser?.id]);\n\n'''
          s = s[:start] + loader + s[end:]
          p.write_text(s)

      - name: Verify
        run: |
          grep -q "getLatestCachedAppData" src/App.tsx
          grep -q "getCachedDeveloperView" src/views/DeveloperView.tsx
          grep -q "Project deleted. Create a new developer project." src/views/DeveloperView.tsx
          test -f src/services/developerCache.ts

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/appCache.ts src/services/developerCache.ts src/views/DeveloperView.tsx
          git rm .github/workflows/finalize-offline-first.yml .github/workflows/finalize-offline-first-v2.yml
          git commit -m "Make auth and DeveloperView offline-first" || exit 0
          git push
