name: Apply account sync fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: python3 scripts/fix_token_care_account_sync.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git add src/lib/supabase.ts src/App.tsx
          git commit -m "fix: synchronize account balance, wallet address, and token ownership [skip ci]"
          git push origin main
