name: Finalize Offline First

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch offline session and DeveloperView
        shell: python
        run: |
          from pathlib import Path

          # ---------- App cache: latest user bootstrap ----------
          p = Path('src/services/appCache.ts')
          s = p.read_text()
          anchor = '''export function getSyncCachedAppData(userId?: string): CachedAppData | null {'''
          if 'export function getLatestCachedAppData()' not in s:
              insert = '''export function getLatestCachedAppData(): CachedAppData | null {\n  if (typeof localStorage === 'undefined') return null;\n  try {\n    let newest: CachedAppData | null = null;\n    for (let i = 0; i < localStorage.length; i++) {\n      const k = localStorage.key(i);\n      if (!k || !k.startsWith('tokencare_cache_')) continue;\n      const raw = localStorage.getItem(k);\n      if (!raw) continue;\n      const parsed = JSON.parse(raw) as CachedAppData;\n      if (!parsed?.userId) continue;\n      if (!newest || Number(parsed.lastSyncTimestamp || 0) > Number(newest.lastSyncTimestamp || 0)) newest = parsed;\n    }\n    return newest;\n  } catch {\n    return null;\n  }\n}\n\n'''
              if s.count(anchor) != 1: raise SystemExit('appCache anchor not found')
              s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s)

          # ---------- App: restore cached identity if Supabase cannot be reached ----------
          p = Path('src/App.tsx')
          s = p.read_text()
          old_import = '''  getCachedAppData,\n  setCachedAppData,\n  clearCachedAppData,\n  SessionStatus,\n  CachedAppData,\n} from './services/appCache';'''
          new_import = '''  getCachedAppData,\n  getLatestCachedAppData,\n  setCachedAppData,\n  clearCachedAppData,\n  SessionStatus,\n  CachedAppData,\n} from './services/appCache';'''
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          else:
              raise SystemExit('App cache import block not found')

          old = '''        } else {\n          setCurrentUser(null);\n          setUserProfile(null);\n          setTokens([]);\n        }\n      } catch (err) {\n        console.warn('[App] Offline cache bootstrap note:', err);\n      }'''
          new = '''        } else {\n          // Supabase can fail to reach the network while the persisted session is still\n          // unavailable to getSession(). Restore the last authenticated identity locally\n          // so the app remains usable offline; online sync will validate it again.\n          const cachedIdentity = getLatestCachedAppData();\n          if (cachedIdentity?.userId) {\n            const cachedUser = {\n              id: cachedIdentity.userId,\n              email: cachedIdentity.userEmail || '',\n              user_metadata: cachedIdentity.userProfile ? {\n                full_name: cachedIdentity.userProfile.display_name,\n                username: cachedIdentity.userProfile.username,\n                avatar_url: cachedIdentity.userProfile.avatar_url,\n              } : {},\n            };\n            setCurrentUser(cachedUser);\n            if (cachedIdentity.userProfile) setUserProfile(cachedIdentity.userProfile);\n            if (cachedIdentity.tokens) setTokens(cachedIdentity.tokens);\n            if (cachedIdentity.wallet) setWallet(cachedIdentity.wallet);\n            setUnreadNotificationCount(cachedIdentity.unreadCount || 0);\n            setLastSyncTimestamp(cachedIdentity.lastSyncTimestamp || null);\n            setSessionStatus('offline');\n          } else {\n            setCurrentUser(null);\n            setUserProfile(null);\n            setTokens([]);\n          }\n        }\n      } catch (err) {\n        // Last-resort offline bootstrap from the user-scoped cache.\n        const cachedIdentity = getLatestCachedAppData();\n        if (cachedIdentity?.userId) {\n          setCurrentUser({ id: cachedIdentity.userId, email: cachedIdentity.userEmail || '', user_metadata: {} });\n          if (cachedIdentity.userProfile) setUserProfile(cachedIdentity.userProfile);\n          if (cachedIdentity.tokens) setTokens(cachedIdentity.tokens);\n          if (cachedIdentity.wallet) setWallet(cachedIdentity.wallet);\n          setUnreadNotificationCount(cachedIdentity.unreadCount || 0);\n          setLastSyncTimestamp(cachedIdentity.lastSyncTimestamp || null);\n          setSessionStatus('offline');\n        } else {\n          console.warn('[App] Offline cache bootstrap note:', err);\n        }\n      }'''
          if old not in s: raise SystemExit('App session bootstrap block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- DeveloperView: cache-first + background refresh ----------
          p = Path('src/views/DeveloperView.tsx')
          s = p.read_text()
          import_anchor = "import { ToastNotification } from '../components/ToastNotification';\n"
          if "from '../services/developerCache'" not in s:
              s = s.replace(import_anchor, import_anchor + "import { getCachedDeveloperView, setCachedDeveloperView, clearCachedDeveloperView } from '../services/developerCache';\n", 1)

          old = '''  // Load project & stats from Supabase Developer tables and RPCs\n  const loadData = async () => {\n    setLoading(true);\n    setError('');\n    try {\n      // 1. Entry guard check: Call get_my_developer_project() via Supabase\n      const proj = await getDeveloperProject();\n\n      if (!proj) {\n        // User has no Developer project -> stay on page and do not auto-open modal\n        setProject(null);\n        setQuota(null);\n        setUsage([]);\n        setLogs([]);\n        setSubscriptions([]);\n        setShowCreateModal(false);\n        return;\n      }\n\n      // User has an existing project -> set project, dismiss create popup, and load dashboard data\n      setProject(proj);\n      setShowCreateModal(false);\n      setEditProjectName(proj.project_name || '');\n      \n      const [quotaData, plansData, usageData, logData, subsData] = await Promise.all([\n        getDeveloperQuota().catch(() => null),\n        getDeveloperPlans().catch(() => DEFAULT_DEVELOPER_PLANS),\n        getDeveloperUsage(30).catch(() => []),\n        getDeveloperApiLogs(100).catch(() => []),\n        getDeveloperSubscriptions().catch(() => []),\n      ]);\n\n      setQuota(quotaData);\n      setPlans(Array.isArray(plansData) && plansData.length > 0 ? plansData : DEFAULT_DEVELOPER_PLANS);\n      setUsage(Array.isArray(usageData) ? usageData : []);\n      setLogs(Array.isArray(logData) ? logData : []);\n      setSubscriptions(Array.isArray(subsData) ? subsData : []);\n    } catch (err: any) {\n      console.warn('[DeveloperView] load error:', err);\n      const msg = err?.message || 'Unable to load developer project from Supabase.';\n      setError(msg);\n      showToast(msg, 'error');\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  useEffect(() => {\n    loadData();\n  }, []);'''

          new = '''  // Cache-first Developer dashboard. Cached state renders immediately; when online,\n  // Supabase is refreshed in the background without putting the page into a loading state.\n  const loadData = async (options: { background?: boolean } = {}) => {\n    const background = options.background === true;\n    const userId = currentUser?.id;\n    if (!userId) return;\n\n    const cached = getCachedDeveloperView(userId);\n    const hasCachedProject = !!cached?.project;\n\n    if (cached) {\n      setProject(cached.project);\n      setQuota(cached.quota);\n      setPlans(Array.isArray(cached.plans) && cached.plans.length ? cached.plans : DEFAULT_DEVELOPER_PLANS);\n      setSubscriptions(Array.isArray(cached.subscriptions) ? cached.subscriptions : []);\n      setUsage(Array.isArray(cached.usage) ? cached.usage : []);\n      setLogs(Array.isArray(cached.logs) ? cached.logs : []);\n      if (cached.project) {\n        setEditProjectName(cached.project.project_name || '');\n        setShowCreateModal(false);\n      } else {\n        setShowCreateModal(true);\n      }\n      setLoading(false);\n    } else if (!background) {\n      setLoading(true);\n    }\n\n    setError('');\n\n    // Never make network calls while offline. The cached Developer page remains usable.\n    if (typeof navigator !== 'undefined' && !navigator.onLine) {\n      if (!cached) {\n        setProject(null);\n        setQuota(null);\n        setUsage([]);\n        setLogs([]);\n        setSubscriptions([]);\n        setShowCreateModal(true);\n      }\n      setLoading(false);\n      return;\n    }\n\n    try {\n      const proj = await getDeveloperProject();\n\n      // A project disappearing while another device is signed into the same account\n      // is a real deletion, not a transient network failure. Remove stale local state.\n      if (!proj) {\n        if (hasCachedProject) {\n          clearCachedDeveloperView(userId);\n          setProject(null);\n          setQuota(null);\n          setUsage([]);\n          setLogs([]);\n          setSubscriptions([]);\n          setShowCreateModal(true);\n          showToast('Project deleted. Create a new developer project.', 'info');\n        } else {\n          setProject(null);\n          setQuota(null);\n          setUsage([]);\n          setLogs([]);\n          setSubscriptions([]);\n          setShowCreateModal(true);\n        }\n        return;\n      }\n\n      setProject(proj);\n      setShowCreateModal(false);\n      setEditProjectName(proj.project_name || '');\n\n      const [quotaData, plansData, usageData, logData, subsData] = await Promise.all([\n        getDeveloperQuota().catch(() => null),\n        getDeveloperPlans().catch(() => DEFAULT_DEVELOPER_PLANS),\n        getDeveloperUsage(30).catch(() => []),\n        getDeveloperApiLogs(100).catch(() => []),\n        getDeveloperSubscriptions().catch(() => []),\n      ]);\n\n      const finalPlans = Array.isArray(plansData) && plansData.length > 0 ? plansData : DEFAULT_DEVELOPER_PLANS;\n      const finalUsage = Array.isArray(usageData) ? usageData : [];\n      const finalLogs = Array.isArray(logData) ? logData : [];\n      const finalSubs = Array.isArray(subsData) ? subsData : [];\n\n      setQuota(quotaData);\n      setPlans(finalPlans);\n      setUsage(finalUsage);\n      setLogs(finalLogs);\n      setSubscriptions(finalSubs);\n\n      setCachedDeveloperView({\n        userId,\n        project: proj,\n        quota: quotaData,\n        plans: finalPlans,\n        subscriptions: finalSubs,\n        usage: finalUsage,\n        logs: finalLogs,\n        lastSyncTimestamp: Date.now(),\n      });\n    } catch (err: any) {\n      // A network failure must never replace valid cached Developer state.\n      console.warn('[DeveloperView] background refresh failed; keeping cache:', err);\n      if (!cached) {\n        const msg = err?.message || 'Unable to load developer project from Supabase.';\n        setError(msg);\n      }\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  useEffect(() => {\n    loadData();\n\n    const handleOffline = () => {\n      // Do not fetch or clear anything. Existing state remains visible.\n      setLoading(false);\n    };\n    const handleOnline = () => {\n      // Revalidate after reconnect, but keep cached UI visible during the refresh.\n      loadData({ background: true });\n    };\n\n    window.addEventListener('offline', handleOffline);\n    window.addEventListener('online', handleOnline);\n    return () => {\n      window.removeEventListener('offline', handleOffline);\n      window.removeEventListener('online', handleOnline);\n    };\n  }, [currentUser?.id]);'''

          if old not in s:
              raise SystemExit('Developer loadData block not found exactly; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- Make successful project mutations immediately update the cache ----------
          # Existing handlers call loadData(), so the cache is refreshed after creation/rotation/etc.
          # No design changes are made.

      - name: Verify source integrity
        run: |
          test -f src/services/developerCache.ts
          grep -q "getLatestCachedAppData" src/services/appCache.ts
          grep -q "background: true" src/views/DeveloperView.tsx
          grep -q "Project deleted. Create a new developer project." src/views/DeveloperView.tsx

      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/appCache.ts src/services/developerCache.ts src/views/DeveloperView.tsx
          git rm .github/workflows/finalize-offline-first.yml
          git commit -m "Make auth and DeveloperView offline-first" || exit 0
          git push
