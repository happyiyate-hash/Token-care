name: Finalize Developer Security UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the exact Developer UI patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/wire-developer-security.yml').read_text()
          marker = "        run: |\n          from pathlib import Path\n"
          start = workflow.index(marker) + len("        run: |\n")
          end = workflow.index("\n\n      - name: Validate TypeScript", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'wire-developer-security.yml', 'exec'), {})

      - name: Commit Developer UI changes and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/DeveloperView.tsx
          git rm .github/workflows/wire-developer-security.yml .github/workflows/fix-wire-security-workflow.yml .github/workflows/finalize-developer-security.yml || true
          git commit -m "Wire Developer security controls to Supabase" || exit 0
          git push
