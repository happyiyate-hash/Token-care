name = "tokencare-user-token-cache"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# KV Namespace Binding
# Create your KV namespace in Cloudflare dashboard or via CLI:
#   npx wrangler kv namespace create TOKEN_CACHE
# Then replace YOUR_KV_NAMESPACE_ID below:
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID" # optional for local dev
